<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">💰 Expense Tracker</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Welcome</h1>
        <p class="lead">Manage your daily expenses smartly.</p>
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card shadow text-center p-4">
                <h2>➕</h2>
                <h4>Add Expense</h4>
                <a href="/add" class="btn btn-primary mt-3">Open</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow text-center p-4">
                <h2>📋</h2>
                <h4>View Expenses</h4>
                <a href="/view" class="btn btn-success mt-3">Open</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow text-center p-4">
                <h2>📊</h2>
                <h4>Reports</h4>
                <a href="/reports" class="btn btn-warning mt-3">Open</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
