<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            Expense Tracker
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/add">Add Expense</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/view">View Expenses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/reports">Reports</a>
                </li>

            </ul>

            <a href="/logout" class="btn btn-outline-light">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow-sm border-0 p-4">

        <h2 class="text-center mb-4">Expense Reports</h2>

        <div class="row mb-4">

            <div class="col-md-6 mb-3 mb-md-0">
                <div class="card dashboard-card">
                    <h3>Total Expense</h3>
                    <h1>₹{{ "{:,.0f}".format(total) }}</h1>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card dashboard-card">
                    <h3>Total Transactions</h3>
                    <h1>{{ count }}</h1>
                </div>
            </div>

        </div>

        <div class="row">

            <div class="col-lg-6 mb-4">
                <h4 class="text-center h5">Category Wise Expenses</h4>
                <canvas id="pieChart"></canvas>
            </div>

            <div class="col-lg-6 mb-4">
                <h4 class="text-center h5">Monthly Expense Trend</h4>
                <canvas id="lineChart"></canvas>
            </div>

        </div>

        <div class="text-center mt-4">

            <a href="/" class="btn btn-outline-secondary">
                Dashboard
            </a>

            <a href="/export" class="btn btn-primary">
                Export CSV
            </a>

            <a href="/export_pdf" class="btn btn-primary">
                Export PDF
            </a>

        </div>

    </div>

</div>

<script>
const pieCtx = document.getElementById('pieChart');

new Chart(pieCtx, {
    type: 'pie',
    data: {
        labels: {{ categories | tojson }},
        datasets: [{
            data: {{ amounts | tojson }},
            backgroundColor: [
                '#1e3a5f',
                '#2c4a75',
                '#667085',
                '#0f1b33',
                '#98a2b3',
                '#12795b',
                '#d0d5dd'
            ]
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                position: 'bottom'
            }
        }
    }
});

const lineCtx = document.getElementById('lineChart');

new Chart(lineCtx, {
    type: 'line',
    data: {
        labels: {{ months | tojson }},
        datasets: [{
            label: 'Monthly Expenses',
            data: {{ totals | tojson }},
            borderColor: '#1e3a5f',
            backgroundColor: 'rgba(30,58,95,0.1)',
            tension: 0.3,
            fill: true
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                display: true
            }
        }
    }
});
</script>

</body>
</html>
