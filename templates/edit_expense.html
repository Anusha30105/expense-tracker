<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto" style="max-width:600px;">

        <h2 class="text-center mb-4">Edit Expense</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ expense[1] }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    class="form-control"
                    value="{{ expense[2] }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select
                    name="category"
                    class="form-select">

                    <option value="Food" {% if expense[3]=="Food" %}selected{% endif %}>Food</option>

                    <option value="Travel" {% if expense[3]=="Travel" %}selected{% endif %}>Travel</option>

                    <option value="Shopping" {% if expense[3]=="Shopping" %}selected{% endif %}>Shopping</option>

                    <option value="Bills" {% if expense[3]=="Bills" %}selected{% endif %}>Bills</option>

                    <option value="Medical" {% if expense[3]=="Medical" %}selected{% endif %}>Medical</option>

                    <option value="Education" {% if expense[3]=="Education" %}selected{% endif %}>Education</option>

                    <option value="Entertainment" {% if expense[3]=="Entertainment" %}selected{% endif %}>Entertainment</option>

                    <option value="Other" {% if expense[3]=="Other" %}selected{% endif %}>Other</option>

                </select>

            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input
                    type="date"
                    name="date"
                    class="form-control"
                    value="{{ expense[4] }}"
                    required>
            </div>

            <button class="btn btn-primary w-100">
                Update Expense
            </button>

        </form>

        <a href="/view" class="btn btn-outline-secondary mt-3 w-100">
            Back
        </a>

    </div>

</div>

</body>
</html>
